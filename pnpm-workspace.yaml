packages:
  - packages/*
  - wikibrowser
  - skill-registry-web
  - workers/wiki-mcp
  - workers/wiki-assistant
  - workers/wiki-generator
  - workers/payment
  - extensions/wiki-clipper
  - tools/candid

allowBuilds:
  esbuild: true
  esbuild@0.25.4: true
  esbuild@0.27.3: true
  esbuild@0.28.1: true
  sharp: true
  sharp@0.34.5: true
  sharp@0.35.0: true
  unrs-resolver: true
  unrs-resolver@1.11.1: true
  workerd: true
  workerd@1.20260507.1: true

minimumReleaseAgeExclude:
  - postcss@8.5.23
  - ws@8.21.0
  - typescript@7.0.2
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - '@mizchi/vlmkit@0.23.0'

peerDependencyRules:
  allowedVersions:
    'tailwindcss-animate>tailwindcss': 3.4.18

overrides:
  '@babel/core': 7.29.6
  '@hono/node-server': 2.0.10
  '@modelcontextprotocol/sdk': 1.31.0
  baseline-browser-mapping: 2.11.20
  browserslist: 4.28.7
  esbuild: 0.28.1
  fflate: 0.7.5
  fast-uri: 3.1.8
  form-data: 4.0.6
  hono: 4.13.7
  ip-address: 10.7.1
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  postcss-selector-parser: 7.1.6
  proxy-addr: 2.0.8
  qs: 6.16.0
  seroval: 1.6.3
  sharp: 0.35.5
  source-map-js: 1.2.2
  'kinic-wiki-generator>wrangler': 4.136.0
  'kinic-wiki-mcp>wrangler': 4.136.0
  undici: 7.29.1
  ws: 8.21.0

# Temporary exception until braces publishes a fix for CVE-2026-93687.
# Only Tailwind's dev-only glob tooling uses it; both tailwind.config.ts files
# contain fixed repository globs, with no user-provided patterns. Production
# audit has no findings. Remove this exception when a patched release exists.
# https://github.com/advisories/GHSA-vfj7-8cjw-p6xm
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
