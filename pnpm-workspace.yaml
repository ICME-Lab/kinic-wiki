packages:
  - packages/*
  - wikibrowser
  - skill-registry-web
  - workers/wiki-mcp
  - workers/wiki-generator
  - workers/payment
  - extensions/wiki-clipper
  - tools/candid

allowBuilds:
  esbuild: true
  esbuild@0.25.4: true
  esbuild@0.27.3: true
  esbuild@0.28.1: true
  sharp: true
  sharp@0.34.5: true
  sharp@0.35.0: true
  unrs-resolver: true
  unrs-resolver@1.11.1: true
  workerd: true
  workerd@1.20260507.1: true

minimumReleaseAgeExclude:
