interface:
  display_name: "Kinic Wiki MCP"
  short_description: "Find wiki evidence and apply precise, explicit changes."
  default_prompt: "Use $kinic-wiki-mcp to read private Kinic Wiki evidence and use batch mutations only for changes I explicitly request."
dependencies:
  tools:
    - type: "mcp"
      value: "kinic-wiki-mcp"
      description: "OAuth-protected Kinic Wiki Private MCP for private reads and explicit batch writes"
      transport: "streamable_http"
      url: "https://wiki-private-mcp.kinic.xyz/mcp"
policy:
  allow_implicit_invocation: true
