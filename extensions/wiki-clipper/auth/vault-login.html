<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Kinic Vault</title>
    <style>
      :root {
        --bg: #0f121a;
        --surface: #171b26;
        --border: rgba(148, 163, 184, 0.2);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --success: #4ade80;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 55%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
      p { margin: 0 0 22px; font-size: 14px; line-height: 1.5; color: var(--muted); }
      .btn {
        width: 100%;
        border: none;
        border-radius: 11px;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: #ffffff;
      }
      .btn:hover:not(:disabled) { background: var(--accent-hover); }
      .btn:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 16px; font-size: 13px; min-height: 20px; color: var(--muted); }
      .status.ok { color: var(--success); }
      .status.err { color: var(--danger); }
      .note { margin-top: 20px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="../icons/icon-128.png" alt="" class="logo" />
      <h1 id="heading">Sign in to Kinic Vault</h1>
      <p id="copy">
        Keep this tab open while Internet Identity completes sign-in. Your Vault stays synced across Web, iOS, and Chrome.
      </p>
      <button id="btn-login" class="btn" type="button">Continue with Internet Identity</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="note">Kinic Vault uses end-to-end encryption. Passwords never leave your device unencrypted.</div>
    </main>
    <script src="../dist/vault-login.js" type="module"></script>
  </body>
</html>
