[package]
edition = "2021"
rust-version = "1.88.0"
name = "ic-agent"
version = "0.49.2"
authors = ["DFINITY Stiftung <sdk@dfinity.org>"]
build = false
include = [
    "src",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Agent library to communicate with the Internet Computer, following the Public Specification."
homepage = "https://docs.rs/ic-agent"
documentation = "https://docs.rs/ic-agent"
readme = "README.md"
keywords = [
    "internet-computer",
    "agent",
    "icp",
    "dfinity",
]
categories = [
    "api-bindings",
    "data-structures",
    "no-std",
]
license = "Apache-2.0"
repository = "https://github.com/dfinity/agent-rs"

[package.metadata.docs.rs]
features = ["wasm-bindgen"]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

# Enables rangemap's StepLite implementation on candid's re-exported Principal.
# There is no direct import for cargo-machete to detect.
[package.metadata.cargo-machete]
ignored = ["ic_principal"]

[features]
_internal_dynamic-routing = []
default = ["pem"]
ic_ref_tests = ["default"]
pem = [
    "dep:pem",
    "pkcs8/pem",
]
ring = ["dep:ring"]
tracing = ["dep:tracing"]
wasm-bindgen = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:getrandom",
    "dep:getrandom_0_2",
    "dep:web-sys",
    "time/wasm-bindgen",
    "cached/wasm",
]

[lib]
