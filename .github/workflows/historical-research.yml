name: Historical research checks

on:
  pull_request:
    paths:
      - evaluation/historical-research/**
      - .github/workflows/historical-research.yml
  push:
    branches: [main]
    paths:
      - evaluation/historical-research/**
      - .github/workflows/historical-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-isolation:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch immutable pre-squash evidence commits
        run: >-
          git fetch --no-tags origin
          07ac286ec5b39e879c4824f08d31c5efd25852c6
          366f95b737ff9d4abd98e1288d73859336f3474f
          e776f1e9a3b798bcb16a15df524c1e9298d006cf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen provenance, budgets and actual filesystem isolation
        run: python3 -m unittest discover -s evaluation/historical-research -v
