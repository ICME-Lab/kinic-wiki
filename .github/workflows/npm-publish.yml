name: Publish npm CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (empty uses the workflow ref)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check version and release assets
        working-directory: npm/kinic-vfs-cli
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="$(bash ../../scripts/kinic_vfs_cli_release_version.sh)"
          test "$RELEASE_TAG" = "$expected_tag"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          for platform in macos-arm64 linux-x86_64; do
            asset="kinic-vfs-cli-v${version}-${platform}.tar.gz"
            checksum="${asset%.tar.gz}.sha256"
            curl -fsSI "https://github.com/ICME-Lab/kinic-wiki/releases/download/v${version}/${asset}" >/dev/null
            curl -fsSI "https://github.com/ICME-Lab/kinic-wiki/releases/download/v${version}/${checksum}" >/dev/null
          done
      - name: Test npm package
        working-directory: npm/kinic-vfs-cli
        run: npm test
      - name: Dry-run package
        working-directory: npm/kinic-vfs-cli
        run: npm pack --dry-run
      - name: Smoke install packed package
        working-directory: npm/kinic-vfs-cli
        run: |
          package_tgz="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" "./${package_tgz}"
          "$prefix/bin/kinic-vfs-cli" --version
          "$prefix/bin/kinic-vfs-cli" codex setup --help
          smoke_dir="$(mktemp -d)"
          setup_json="$(cd "$smoke_dir" && "$prefix/bin/kinic-vfs-cli" codex setup --json --dry-run --executable "$prefix/bin/kinic-vfs-cli")"
          node -e 'const setup = JSON.parse(process.argv[1]); if (setup.status !== "dry_run" || setup.engine !== "codex" || setup.activation !== "unknown" || !Array.isArray(setup.changes) || setup.changes.length === 0) process.exit(1);' "$setup_json"
      - name: Publish
        working-directory: npm/kinic-vfs-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
