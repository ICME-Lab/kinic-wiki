name: Publish npm CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (empty uses the workflow ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-cli-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - id: source
        name: Verify release source and both platform checksums
        run: |
          commit="$(python3 scripts/cli_release.py source --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY")"
          python3 scripts/cli_release.py verify --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Test npm package
        working-directory: npm/kinic-vfs-cli
        run: npm test
      - name: Dry-run package
        working-directory: npm/kinic-vfs-cli
        run: npm pack --dry-run
      - name: Smoke fresh install and upgrade from 2.0.4
        timeout-minutes: 15
        working-directory: npm/kinic-vfs-cli
        run: |
          package_tgz="$(npm pack --silent)"
          expected_version="$(bash ../../scripts/kinic_vfs_cli_release_version.sh --plain)"
          python3 ../../scripts/smoke_cli_upgrade.py --package "$package_tgz" --version "$expected_version"
      - name: Publish
        working-directory: npm/kinic-vfs-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 ../../scripts/cli_release.py verify --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT"
          npm publish
