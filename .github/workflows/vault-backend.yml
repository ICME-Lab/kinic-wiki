name: Vault backend snapshot
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup toolchain install --profile minimal && rustup target add wasm32-unknown-unknown
      - run: cargo test --locked -p vault-types -p vault-store -p vault-service -p vault-canister
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p vault-canister
      - run: npm ci --prefix pocketic-tests --ignore-scripts
      - name: Install pinned Candid compiler
        run: |
          mkdir -p target/tools
          curl -fsSL --retry 3 https://github.com/dfinity/candid/releases/download/didc-v0.6.2/didc-x86_64-unknown-linux-gnu.tar.xz -o target/tools/didc.tar.xz
          echo "9990d2646a2b023df50c8765fd34e43951ba947303d3ce9d06590b2d58e89469  target/tools/didc.tar.xz" | sha256sum -c -
          tar -xJf target/tools/didc.tar.xz -C target/tools --strip-components=1 didc-x86_64-unknown-linux-gnu/didc
          test "$(target/tools/didc --version)" = "didc 0.6.2"
          echo "$GITHUB_WORKSPACE/target/tools" >> "$GITHUB_PATH"
      - name: Provision pinned PocketIC
        run: |
          curl -fsSL --retry 3 https://github.com/dfinity/pocketic/releases/download/16.1.0/pocket-ic-x86_64-linux.gz -o target/tools/pocket-ic.gz
          gzip -dc target/tools/pocket-ic.gz > target/tools/pocket-ic
          chmod +x target/tools/pocket-ic
          test "$(target/tools/pocket-ic --version)" = "pocket-ic-server 16.1.0"
      - run: node pocketic-tests/scripts/download-vault-ledger.mjs
      - run: node pocketic-tests/scripts/build-vault-funding-fault.mjs
      - run: node pocketic-tests/integration/vault-funding-ledger.test.mjs
        env:
          POCKET_IC_BIN: ${{ github.workspace }}/target/tools/pocket-ic
