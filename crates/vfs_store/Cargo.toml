[package]
name = "vfs-store"
version = "0.1.0"
edition = "2024"

[features]
bench-search-stages = []

[dependencies]
sha2 = "0.10.9"
vfs_types = { package = "kinic-vfs-types", version = "0.1.0", path = "../vfs_types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled", "hooks"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-sqlite-vfs = { workspace = true, features = ["sqlite-precompiled"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.23.0"
vfs_types = { package = "kinic-vfs-types", version = "0.1.0", path = "../vfs_types" }
