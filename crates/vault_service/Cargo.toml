[package]
name = "vault-service"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["rlib"]
[dependencies]
vault-types = { path = "../vault_types" }
vault-store = { path = "../vault_store" }
kinic-sqlite-compat = { path = "../kinic_sqlite_compat" }
candid = "0.10.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ic-vetkeys = "=0.9.0"
passkey-auth = "=0.1.3"
base64 = "0.22"
ic_bls12_381 = { version = "0.10.1", default-features = false, features = ["groups"] }
[dev-dependencies]
futures = "0.3"
aes-gcm = "0.10"
hex = "0.4"
