[package]
name = "vault-service"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["rlib"]
[dependencies]
vault-types = { path = "../vault_types" }
vault-store = { path = "../vault_store" }
kinic-sqlite-compat = { path = "../kinic_sqlite_compat" }
candid = "0.10.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ic-vetkeys = "=0.9.0"
[dev-dependencies]
sha2 = "0.10"
futures = "0.3"
hex = "0.4"
[target.'cfg(target_arch = "wasm32")'.dependencies]
# ic-vetkeys depends on rand; IC entropy is explicitly fetched through raw_rand.
getrandom = { version = "0.2", features = ["custom"] }
