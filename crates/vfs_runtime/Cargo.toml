[package]
name = "vfs-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
vault-store = { path = "../vault_store" }
vault-types = { path = "../vault_types" }
url = "2"
candid = "0.10.26"
kinic-sqlite-compat = { path = "../kinic_sqlite_compat" }
serde_json = "1.0.145"
sha2 = "0.10.9"
vfs_types = { package = "kinic-vfs-types", version = "0.1.0", path = "../vfs_types" }
vfs-store = { path = "../vfs_store" }
wiki_domain = { package = "kinic-wiki-domain", path = "../wiki_domain" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-sqlite-vfs = { workspace = true, features = ["sqlite-precompiled"] }

[dev-dependencies]
proptest = "1.11.0"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks"] }
tempfile = "3.23.0"
