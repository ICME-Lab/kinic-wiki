[package]
name = "vault-canister"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
vault-service = { path = "../vault_service" }
vault-store = { path = "../vault_store" }
vault-types = { path = "../vault_types" }
kinic-sqlite-compat = { path = "../kinic_sqlite_compat" }
ic-cdk-management-canister = "=0.1.1"
candid = "0.10.26"
ic-cdk = "0.20.0"
ic-cdk-timers = "1.0.0"
ic-http-certification = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
url = "2.5.7"
[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-sqlite-vfs = { workspace = true, features = ["sqlite-precompiled"] }
