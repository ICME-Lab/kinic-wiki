[package]
name = "kinic-vault-vetkeys"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
ic-vetkeys = "=0.9.0"
ic-cdk-management-canister = "=0.1.1"
zeroize = "1.8.1"
[dev-dependencies]
hex = "0.4.3"

# Current Apple strip can produce a misaligned LINKEDIT string pool in proc-macro
# dylibs. Only host build tools keep their debug metadata; shipped static code is
# still compiled with the normal release profile.
[profile.release.build-override]
strip = "none"
